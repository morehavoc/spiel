# Every pull request: the native selftest the release workflow runs,
# so a PR shows pass/fail before it is merged. No secrets, no signing, nothing published.
name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26 # SpeechAnalyzer needs the macOS 26 SDK
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Public repo: workflow logs are world-readable. Fail any workflow that prints an email/name field.
      - name: No personal data printed by workflows
        run: |
          if grep -nE "print\(.*(email|firstName|lastName)" .github/workflows/*.yml; then
            echo "::error::A workflow prints personal data into a public log."; exit 1
          fi
      - name: Selftest
        working-directory: native
        run: |
          swift build -c release --product spiel-cli
          .build/release/spiel-cli selftest
